# Repland 团队协作后端（Ktor）—— 子路径反代
#
# 与 /lamp/、/moon/、/bci/ 同一套共存模式：只占 /repland/ 前缀，不动既有 location。
# 上游 127.0.0.1:3120 只监听回环，公网入口只有这一条 443。
# 部署：2026-11-02；主配置 sites-enabled/ilovemxt 增加一行 include。
# 回滚：去掉 include 行 + sudo rm 本文件 + sudo nginx -t && sudo systemctl reload nginx。

location /repland/ {
    # 末尾的 / 会剥掉 /repland 前缀：/repland/health → 上游 /health
    proxy_pass http://127.0.0.1:3120/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # 队伍快照是整份 JSON（含资料卡与排期），默认 1m 会在大队伍上 413
    client_max_body_size 4m;
}
